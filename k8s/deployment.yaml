apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api
  namespace: {{NAMESPACE}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-api
  template:
    metadata:
      labels:
        app: iris-api
    spec:
      containers:
        - name: iris-api
          image: {{IMAGE_URI}}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{APP_PORT}}
          readinessProbe:
            httpGet:
              path: /health
              port: {{APP_PORT}}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{APP_PORT}}
            initialDelaySeconds: 10
            periodSeconds: 10
