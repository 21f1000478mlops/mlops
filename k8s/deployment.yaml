apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-classifier-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris-classifier-service
  template:
    metadata:
      labels:
        app: iris-classifier-service
    spec:
      serviceAccountName: telemetry-access 
      containers:
      - name: fastapi-container
        image: us-central1-docker.pkg.dev/DUMMY_PROJECT/DUMMY_REPO/iris-classifier:latest
        ports:
        - containerPort: 8200
        readinessProbe:
          httpGet:
            path: /ready_check
            port: 8200
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live_check
            port: 8200
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"