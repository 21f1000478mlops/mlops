name: Manual Stress Test

on:
  workflow_dispatch:
    inputs:
      connections:
        description: 'Number of concurrent connections (e.g., 1000 or 2000)'
        required: true
        default: '1000'
        type: choice
        options:
        - '1000'
        - '2000'
      max_pods:
        description: 'Set HPA maxReplicas (3 for scale test, 1 for bottleneck)'
        required: true
        default: '3'
        type: choice
        options:
        - '1'
        - '3'

env:
  PROJECT_ID: "dulcet-bastion-452612-v4" 
  GKE_CLUSTER: "iris-cluster"     
  GKE_ZONE: "us-central1-a"       
  WIF_PROVIDER: "projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/YOUR_POOL_NAME/providers/YOUR_PROVIDER_NAME"
  GSA_EMAIL: "telemetry-access@dulcet-bastion-452612-v4.iam.gserviceaccount.com"
  SERVICE_NAME: "iris-classifier-service"

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  run-stress-test:
    name: Run 'wrk' Stress Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GSA_EMAIL }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Install GKE Auth Plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin
          gcloud config set container/use_application_default_credentials true
        
      - name: Get GKE Credentials
        run: gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }} --project ${{ env.PROJECT_ID }}

      - name: Configure HPA for Test
        run: |
          echo "Setting HPA maxReplicas to ${{ github.event.inputs.max_pods }}"
          sed -i 's/maxReplicas: [0-9]\+/maxReplicas: ${{ github.event.inputs.max_pods }}/' k8s/hpa.yaml
          kubectl apply -f k8s/hpa.yaml
          echo "Waiting 30s for HPA to update..."
          sleep 30

      - name: Install wrk
        run: sudo apt-get install -y wrk

      - name: Get Service External IP
        id: get_ip
        run: |
          echo "Waiting for External IP..."
          SERVICE_IP=""
          for _ in $(seq 1 30); do
            SERVICE_IP=$(kubectl get service ${{ env.SERVICE_NAME }} -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$SERVICE_IP" ]; then
              echo "IP Found: $SERVICE_IP"
              echo "ip=$SERVICE_IP" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting..."
            sleep 10
          done
          if [ -z "$SERVICE_IP" ]; then
            echo "::error::Failed to get External IP after 5 minutes."
            exit 1
          fi

      - name: Run 'wrk' Stress Test
        run: |
          echo "Running wrk test with ${{ github.event.inputs.connections }} connections..."
          wrk -t4 -c${{ github.event.inputs.connections }} -d30s --latency -s post.lua http://${{ steps.get_ip.outputs.ip }}:80/predict