name: CI/CD - Build and Deploy to GKE

on:
  push:
    branches:
      - main
      - week-7

env:
  # --- Values from GitHub Secrets ---
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  GSA_EMAIL: ${{ secrets.GSA_EMAIL }}
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}

  # --- Non-sensitive/Static values ---
  GKE_CLUSTER: "iris-cluster"     
  GKE_ZONE: "us-central1-a"       
  IMAGE_REPO_PATH: "us-central1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/mlops-repo/iris-classifier" 
  DEPLOYMENT_NAME: "iris-classifier-service"

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.build_image.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GSA_EMAIL }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Tag Image
        id: build_image
        run: |
          IMAGE_TAG=${{ env.IMAGE_REPO_PATH }}:sha-${{ github.sha }}
          docker build -t $IMAGE_TAG -f Dockerfile .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GSA_EMAIL }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure GKE Auth
        run: |
          gcloud components install gke-gcloud-auth-plugin
          gcloud config set container/use_application_default_credentials true
        
      - name: Get GKE Credentials
        run: gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }} --project ${{ env.PROJECT_ID }}

      - name: Apply K8s Manifests
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Update Deployment with new Image
        run: |
          echo "Updating deployment with new image: ${{ needs.build-and-push.outputs.IMAGE_TAG }}"
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} fastapi-container=${{ needs.build-and-push.outputs.IMAGE_TAG }}
          
      - name: Wait for Deployment Rollout
        run: |
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=5m