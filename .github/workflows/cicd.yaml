name: CI/CD - Build, Deploy, and Test

on:
  push:
    branches:
      - main
      - week-7

env:
  # --- Values from GitHub Secrets ---
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  GSA_EMAIL: ${{ secrets.GSA_EMAIL }}
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}

  # --- Non-sensitive/Static values ---
  GKE_CLUSTER: "iris-cluster"     
  GKE_ZONE: "us-central1-a"       
  IMAGE_REPO_PATH: "us-central1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/mlops-repo/iris-classifier" 
  DEPLOYMENT_NAME: "iris-classifier-service"
  SERVICE_NAME: "iris-classifier-service"

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.build_image.outputs.TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GSA_EMAIL }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Tag Image
        id: build_image
        run: |
          TAG="sha-${{ github.sha }}"
          FULL_IMAGE_TAG="${{ env.IMAGE_REPO_PATH }}:${TAG}"
          
          docker build -t $FULL_IMAGE_TAG -f Dockerfile .
          docker push $FULL_IMAGE_TAG
          
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          
  deploy-and-test: # <-- Renamed job
    name: Deploy and Stress Test
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GSA_EMAIL }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure GKE Auth
        run: |
          gcloud components install gke-gcloud-auth-plugin
          gcloud config set container/use_application_default_credentials true
        
      - name: Get GKE Credentials
        run: gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }} --project ${{ env.PROJECT_ID }}

      - name: Update Manifest with Image
        run: |
          TAG=${{ needs.build-and-push.outputs.TAG }}
          FULL_IMAGE_TAG="${{ env.IMAGE_REPO_PATH }}:${TAG}"
          
          echo "Setting image in deployment.yaml to: $FULL_IMAGE_TAG"
          sed -i "s|image: IMAGE_WILL_BE_REPLACED_BY_CICD|image: $FULL_IMAGE_TAG|g" k8s/deployment.yaml

      - name: Apply K8s Manifests
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/deployment.yaml
          
      - name: Wait for Deployment Rollout
        run: |
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=5m
      
      # --- STRESS TEST STEPS ADDED BELOW ---

      - name: Install wrk
        run: sudo apt-get install -y wrk

      - name: Get Service External IP
        id: get_ip
        run: |
          echo "Waiting for External IP..."
          SERVICE_IP=""
          for _ in $(seq 1 30); do
            SERVICE_IP=$(kubectl get service ${{ env.SERVICE_NAME }} -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$SERVICE_IP" ]; then
              echo "IP Found: $SERVICE_IP"
              echo "ip=$SERVICE_IP" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting..."
            sleep 10
          done
          if [ -z "$SERVICE_IP" ]; then
            echo "::error::Failed to get External IP after 5 minutes."
            exit 1
          fi

      - name: Run 'wrk' Stress Test
        run: |
          echo "Running wrk test..."
          # ---
          # FOR SCENARIO 2 (BOTTLENECK):
          # Change c1000 below to c2000
          # ---
          wrk -t4 -c1000 -d30s --latency -s post.lua http://${{ steps.get_ip.outputs.ip }}:80/predict