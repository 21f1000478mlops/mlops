name: Manual Stress Test

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Select test scenario'
        required: true
        default: '1'
        type: choice
        options:
        - '1' # 1000 conns / 3 pods
        - '2' # 2000 conns / 1 pod

env:
  # --- Values from GitHub Secrets ---
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  GSA_EMAIL: ${{ secrets.GSA_EMAIL }}
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}

  # --- Non-sensitive/Static values ---
  GKE_CLUSTER: "iris-cluster"     
  GKE_ZONE: "us-central1-a"       
  SERVICE_NAME: "iris-classifier-service"

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  run-stress-test:
    name: Run 'wrk' Stress Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GSA_EMAIL }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure GKE Auth
        run: |
          gcloud components install gke-gcloud-auth-plugin
          gcloud config set container/use_application_default_credentials true
        
      - name: Get GKE Credentials
        run: gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }} --project ${{ env.PROJECT_ID }}

      - name: Configure HPA for Test
        run: |
          if [ "${{ github.event.inputs.scenario }}" == "1" ]; then
            echo "Setting HPA maxReplicas to 3 (Autoscaling test)"
            sed -i 's/maxReplicas: [0-9]\+/maxReplicas: 3/' k8s/hpa.yaml
          else
            echo "Setting HPA maxReplicas to 1 (Bottleneck test)"
            sed -i 's/maxReplicas: [0-9]\+/maxReplicas: 1/' k8s/hpa.yaml
          fi
          
          kubectl apply -f k8s/hpa.yaml
          echo "Waiting 30s for HPA to update..."
          sleep 30

      - name: Install wrk
        run: sudo apt-get install -y wrk

      - name: Get Service External IP
        id: get_ip
        run: |
          echo "Waiting for External IP..."
          SERVICE_IP=""
          for _ in $(seq 1 30); do
            SERVICE_IP=$(kubectl get service ${{ env.SERVICE_NAME }} -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$SERVICE_IP" ]; then
              echo "IP Found: $SERVICE_IP"
              echo "ip=$SERVICE_IP" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting..."
            sleep 10
          done
          if [ -z "$SERVICE_IP" ]; then
            echo "::error::Failed to get External IP after 5 minutes."
            exit 1
          fi

      - name: Run 'wrk' Stress Test
        run: |
          if [ "${{ github.event.inputs.scenario }}" == "1" ]; then
            echo "Running wrk test with 1000 connections..."
            wrk -t4 -c1000 -d30s --latency -s post.lua http://${{ steps.get_ip.outputs.ip }}:80/predict
          else
            echo "Running wrk test with 2000 connections..."
            wrk -t4 -c2000 -d30s --latency -s post.lua http://${{ steps.get_ip.outputs.ip }}:80/predict
          fi