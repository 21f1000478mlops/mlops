name: Manual Stress Test

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Select test scenario'
        required: true
        default: '1'
        type: choice
        options:
        - '1' # 1000 conns / 3 pods
        - '2' # 2000 conns / 1 pod

env:
  # --- Values from GitHub Secrets ---
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  GSA_EMAIL: ${{ secrets.GSA_EMAIL }}
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}

  # --- Non-sensitive/Static values ---
  GKE_CLUSTER: "iris-cluster"
  GKE_ZONE: "us-central1-a"
  SERVICE_NAME: "iris-classifier-service"
  NAMESPACE: "default"
  SERVICE_PORT: "80"
  SERVICE_PATH: "/predict"
  HPA_FILE: "k8s/hpa.yaml"
  HPA_APPLY_TIMEOUT_SEC: "60"
  GET_IP_RETRIES: "30"
  GET_IP_DELAY_SEC: "10"
  WRK_DURATION: "30s"
  WRK_THREADS: "4"

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  run-stress-test:
    name: Run 'wrk' Stress Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity)
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GSA_EMAIL }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure GKE Auth plugin & get credentials
        run: |
          set -e
          gcloud components install -q gke-gcloud-auth-plugin
          # Ensure kubectl uses ADC
          gcloud auth configure-docker || true
          gcloud container clusters get-credentials "${GKE_CLUSTER}" --zone "${GKE_ZONE}" --project "${PROJECT_ID}"

      - name: Configure HPA for Test (apply then patch)
        run: |
          set -euo pipefail
          # Determine desired maxReplicas based on selected scenario
          if [ "${{ github.event.inputs.scenario }}" = "1" ]; then
            MAX_REPLICAS=3
            CONNS=1000
          else
            MAX_REPLICAS=1
            CONNS=2000
          fi

          echo "Applying HPA manifest: ${HPA_FILE}"
          kubectl apply -n "${NAMESPACE}" -f "${HPA_FILE}"

          # Extract HPA resource name from the file we just applied
          HPA_NAME=$(kubectl get -n "${NAMESPACE}" -f "${HPA_FILE}" -o jsonpath='{.metadata.name}')
          if [ -z "$HPA_NAME" ]; then
            echo "::error::Could not determine HPA name from ${HPA_FILE}"
            exit 1
          fi
          echo "HPA name: $HPA_NAME"

          echo "Patching HPA '${HPA_NAME}' -> spec.maxReplicas=${MAX_REPLICAS}"
          kubectl -n "${NAMESPACE}" patch hpa "${HPA_NAME}" --type='merge' -p "{\"spec\":{\"maxReplicas\":${MAX_REPLICAS}}}"

          # Optionally wait a little for controller to pick up changes
          echo "Waiting ${HPA_APPLY_TIMEOUT_SEC}s for HPA controller to reconcile..."
          sleep "${HPA_APPLY_TIMEOUT_SEC}"

          # Save values for later steps as outputs
          echo "connections=${CONNS}" >> $GITHUB_OUTPUT
          echo "max_replicas=${MAX_REPLICAS}" >> $GITHUB_OUTPUT

      - name: Install wrk and prepare environment
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y wrk
          # Increase FD limit so wrk can open many connections
          ulimit -n 65536 || true

      - name: Get Service External IP / Hostname
        id: get_ip
        run: |
          set -eu
          RETRIES=${GET_IP_RETRIES}
          DELAY=${GET_IP_DELAY_SEC}
          for i in $(seq 1 $RETRIES); do
            # get ip OR hostname (some LB providers populate hostname)
            IP=$(kubectl -n "${NAMESPACE}" get svc "${SERVICE_NAME}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            HOSTNAME=$(kubectl -n "${NAMESPACE}" get svc "${SERVICE_NAME}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            if [ -n "$IP" ]; then
              echo "Found external IP: $IP"
              echo "ip=$IP" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ -n "$HOSTNAME" ]; then
              echo "Found external hostname: $HOSTNAME"
              echo "ip=$HOSTNAME" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Waiting for external IP/hostname... (${i}/${RETRIES})"
            sleep $DELAY
          done

          echo "::error::Failed to get External IP/hostname for service '${SERVICE_NAME}' after $((RETRIES * DELAY))s"
          exit 1

      - name: Run 'wrk' Stress Test
        id: wrk_run
        run: |
          set -euo pipefail
          TARGET_HOST=${{ steps.get_ip.outputs.ip }}
          TARGET_URL="http://${TARGET_HOST}:${SERVICE_PORT}${SERVICE_PATH}"

          # connections from previous outputs / defaults
          CONNS="${{ steps.configure_hpa.outputs.connections || github.event.inputs.scenario }}" || true
          # Fallback: if connections value not set from configure_hpa, compute here
          if [ -z "${CONNS}" ] || [ "${CONNS}" = "scenario" ]; then
            if [ "${{ github.event.inputs.scenario }}" = "1" ]; then
              CONNS=1000
            else
              CONNS=2000
            fi
          fi

          echo "Target URL: ${TARGET_URL}"
          echo "Connections: ${CONNS}, Threads: ${WRK_THREADS}, Duration: ${WRK_DURATION}"

          # Save wrk output to a file so we can upload it
          OUTFILE="wrk-output-${{ github.run_id }}.txt"

          # If you need to send a body or custom headers, ensure post.lua exists and is committed.
          if [ -f post.lua ]; then
            echo "Using post.lua script"
            wrk -t${WRK_THREADS} -c${CONNS} -d${WRK_DURATION} --latency -s post.lua "${TARGET_URL}" | tee "$OUTFILE"
          else
            wrk -t${WRK_THREADS} -c${CONNS} -d${WRK_DURATION} --latency "${TARGET_URL}" | tee "$OUTFILE"
          fi

          # Print a short summary to the step logs (first 200 lines)
          echo "---- wrk output (first 200 lines) ----"
          head -n 200 "$OUTFILE" || true

          echo "outfile=$OUTFILE" >> $GITHUB_OUTPUT

      - name: Upload wrk output artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrk-output-${{ github.run_id }}
          path: ${{ steps.wrk_run.outputs.outfile }}
